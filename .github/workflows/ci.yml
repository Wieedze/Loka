name: CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bunx vitest run

      - name: Build
        run: bunx vite build

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
